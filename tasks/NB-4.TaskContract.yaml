apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: NB-4
  title: "A baseline"
spec:
  goal: The repository is an Orun baseline — a card and a build document that take a new Nuxt site from nothing to live on stage and prod, branded as its own, with gates that prove it offline, carrying what the portfolio baseline's first live bootstrap taught
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - README.md
    - .gitignore
    - .baseline/**
    - tooling/rebrand/**
    - tooling/bootstrap/**
    - hooks/**
    - testing/**
    - docs/phases/**
    - ai/context/**
    - .github/workflows/**
    - intent.yaml
    - infra/.gitkeep
    - packages/.gitkeep
    - tests/.gitkeep
    - apps/web/**
    - specs/**
    - tasks/**
  doneWhen:
    - orun (the bootstrap floor and the lane pin) reads repo-blueprint.yaml, and the card agrees with it
    - the leak gate, the offline bootstrap and the end-to-end tier (the site built in a job tree staged as orun stages it) are green in Baseline CI
    - no shipped workflow but ci.yml runs on a push to main, held by testing/coverage.test.sh
    - the as-built status records the departures and what is not yet proven live
  gates:
    - checks
