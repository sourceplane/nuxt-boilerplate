apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The upstream Nuxt boilerplate runs on Cloudflare Workers + Static Assets through Nitro's cloudflare_module preset with green checks
  affects:
    - apps/web
    - pnpm-lock.yaml
    - package.json
    - turbo.json
  doneWhen:
    - pnpm typecheck, lint, test and build are green in Checks
    - wrangler dev serves the welcome page and its hashed assets
  gates:
    - checks
